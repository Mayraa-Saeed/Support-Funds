<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrower Registration</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/styles.css"> <!-- Main CSS file -->
    <link rel="shortcut icon" href="logo.png"> 
  </head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html"><img src="logo.png" alt="Logo"></a>
            </div>
            <div class="navigation-bar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="funders.html">Funders</a></li>
                    <li><a href="borrower.html">Borrower</a></li>
                    <li><a href="mentors.html">Mentor</a></li>
                    <li><a href="login.html">Login</a></li>
                </ul>
            </div>
            <div class="toggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>
    <div class="container">
        <div class="sidebar">
            <h3>Create Account</h3>
            <div class="step-item active">
                <span>1</span> Personal Details
            </div>
            <div class="step-item">
                <span>2</span> Account Details
            </div>
            <div class="step-item">
                <span>3</span> Loan Details
            </div>
            <div class="step-item">
                <span>4</span> Review
            </div>
        </div>
        <div class="forrm-container">
            <div class="form-steps">
                <div class="step active">
                    <h2>Personal Details</h2>
                    <label for="nationalID">National Identity Number</label>
                    <input type="text" id="nationalID" placeholder="Enter your ID">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Enter your first name">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Enter your last name">
                    <button class="next-btn">Next</button>
                </div>
                <div class="step">
                    <h2>Account Details</h2>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                    <button class="prev-btn">Previous</button>
                    <button class="next-btn">Next</button>
                </div>
                <div class="step">
                    <h2>Loan Details</h2>
                    <label for="loanAmount">Loan Amount</label>
                    <input type="number" id="loanAmount" placeholder="Enter loan amount">
                    <label for="loanPurpose">Loan Purpose</label>
                    <textarea id="loanPurpose" placeholder="Describe the purpose"></textarea>
                    <button class="prev-btn">Previous</button>
                    <button class="next-btn">Next</button>
                </div>
                <div class="step">
                    <h2>Review</h2>
                    <p>Review your details and confirm.</p>
                    <button class="prev-btn">Previous</button>
                    <button class="submit-btn">Submit</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const steps = document.querySelectorAll('.step');
        const sidebarItems = document.querySelectorAll('.step-item');
        const nextBtns = document.querySelectorAll('.next-btn');
        const prevBtns = document.querySelectorAll('.prev-btn');
        let currentStep = 0;

        function updateSidebar() {
            sidebarItems.forEach((item, index) => {
                if (index === currentStep) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        nextBtns.forEach((btn) => {
            btn.addEventListener('click', () => {
                steps[currentStep].classList.remove('active');
                currentStep++;
                steps[currentStep].classList.add('active');
                updateSidebar();
            });
        });

        prevBtns.forEach((btn) => {
            btn.addEventListener('click', () => {
                steps[currentStep].classList.remove('active');
                currentStep--;
                steps[currentStep].classList.add('active');
                updateSidebar();
            });
        });
    </script>
</body>
</html>
